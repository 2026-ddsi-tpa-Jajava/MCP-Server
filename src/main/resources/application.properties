spring.application.name=donatrack-mcp
server.port=${PORT:8090}

spring.ai.mcp.server.name=donatrack-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# API Gateway de Zuplo: punto de entrada único para clientes como Claude / MCP.
# Los módulos se exponen con prefijos por dominio, por ejemplo:
# https://jajava-gateway-main-15d96d2.zuplo.app/donadores-entidades/...
servicios.url.gateway=${URL_GATEWAY:https://jajava-gateway-main-15d96d2.zuplo.app}
servicios.url.incentivos=${URL_INCENTIVOS:${servicios.url.gateway}/incentivos}
servicios.url.donaciones=${URL_DONACIONES:${servicios.url.gateway}/donaciones}
servicios.url.donadores=${URL_DONADORES:${servicios.url.gateway}/donadores-entidades}
servicios.url.logistica=${URL_LOGISTICA:${servicios.url.gateway}/logistica}
# El servicio de consultas ya expone sus rutas bajo /consultas, por eso el prefijo se repite.
servicios.url.consultas=${URL_CONSULTAS:${servicios.url.gateway}/consultas/consultas}